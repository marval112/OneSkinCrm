<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/dashboard/Logo_Negro.jpg" />
  <link rel="apple-touch-icon" href="/dashboard/Logo_Negro.jpg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneSkin CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="theme-variables">
    :root {
      --color-primary: #0f172a;
      /* Deep Navy (Slate 900) */
      --color-primary-hover: #1e293b;
      /* Slate 800 */
      --color-success: #059669;
      /* Emerald 600 */
      --color-success-hover: #047857;
      --color-warning: #d97706;
      /* Amber 600 */
      --color-warning-hover: #b45309;
      --color-danger: #dc2626;
      /* Red 600 */
      --color-danger-hover: #b91c1c;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: 'var(--color-primary)',
            'primary-hover': 'var(--color-primary-hover)',
            success: 'var(--color-success)',
            'success-hover': 'var(--color-success-hover)',
            warning: 'var(--color-warning)',
            'warning-hover': 'var(--color-warning-hover)',
            danger: 'var(--color-danger)',
            'danger-hover': 'var(--color-danger-hover)',
            light: '#f8fafc',
            dark: '#0f172a',
          },
        },
      },
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
        "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0",
        "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0"
      }
    }
    </script>
</head>

<body class="antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
